<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuSS glyph references</title>
<style>
  body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; background: #fff; color: #222; }
  textarea { width: 100%; height: 320px; font: 11px Menlo, monospace; }
  .warn { color: #b5470b; }
</style>
</head>
<body>
<!--
  Developer tool: makes js/detect/glyphs.js, the stored Courier and Courier New characters the
  printed-code reader (js/detect/ocr.js) compares with. Open this file in a browser that has both
  fonts (macOS and Windows do), then save the text below as js/detect/glyphs.js.
  Each character is drawn large, its ink box found and averaged onto the reader's grid with the
  reader's own functions, so references and scans are normalised the same way.
-->
<h1>Glyph references for the printed-code reader</h1>
<p id="status"></p>
<textarea id="out" readonly></textarea>
<script src="../../js/image/components.js"></script>
<script src="../../js/sheet/code.js"></script>
<script src="../../js/detect/ocr.js"></script>
<script>
(function () {
  'use strict';
  var FONTS = ['Courier', 'Courier New'], GW = 12, GH = 16, FS = 64;
  var ALPHABET = HUSS.sheet.code.ALPHABET || '23456789ABCDEFGHJKLMNPQRTUVWXYZ';
  var status = document.getElementById('status'), problems = [];

  function available(font) {
    var c = document.createElement('canvas').getContext('2d'), s = 'WMQ24AJ';
    c.font = '40px serif'; var a = c.measureText(s).width;
    c.font = '40px "' + font + '", serif'; var b = c.measureText(s).width;
    return Math.abs(a - b) > 0.5;
  }

  function glyph(font, ch) {
    var W = 3 * FS, H = 2 * FS, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#000'; c.font = FS + 'px "' + font + '"'; c.textBaseline = 'alphabetic';
    c.fillText(ch, FS * 0.8, FS * 1.4);
    var px = c.getImageData(0, 0, W, H).data, d = new Float64Array(W * H);
    for (var k = 0; k < W * H; k++) d[k] = 255 - px[k * 4];
    var sample = function (x, y) {
      var sx = x - 0.5, sy = y - 0.5, ix = Math.floor(sx), iy = Math.floor(sy);
      if (ix < 0 || iy < 0 || ix >= W - 1 || iy >= H - 1) return 0;
      var fx = sx - ix, fy = sy - iy, o = iy * W + ix;
      return (1 - fx) * (1 - fy) * d[o] + fx * (1 - fy) * d[o + 1] + (1 - fx) * fy * d[o + W] + fx * fy * d[o + W + 1];
    };
    var box = HUSS.detect.ocr.inkBox(sample, 0, 0, W, H, 1, 128, 4);
    var grid = HUSS.detect.ocr.toGrid(sample, box[0], box[1], box[2], box[3], GW, GH, 4);
    var bytes = new Uint8Array(GW * GH);
    for (k = 0; k < bytes.length; k++) bytes[k] = Math.max(0, Math.min(255, Math.round(grid[k])));
    var bin = '';
    for (k = 0; k < bytes.length; k++) bin += String.fromCharCode(bytes[k]);
    return { a: Math.round(((box[2] - box[0]) / (box[3] - box[1])) * 10000) / 10000, g: btoa(bin) };
  }

  var fonts = {};
  FONTS.forEach(function (f) {
    if (!available(f)) { problems.push(f + ' is not installed in this browser'); return; }
    fonts[f] = {};
    for (var i = 0; i < ALPHABET.length; i++) fonts[f][ALPHABET[i]] = glyph(f, ALPHABET[i]);
  });

  var lines = [];
  Object.keys(fonts).forEach(function (f, fi, all) {
    lines.push('      ' + JSON.stringify(f) + ': {');
    var keys = Object.keys(fonts[f]);
    keys.forEach(function (ch, ci) {
      lines.push('        ' + JSON.stringify(ch) + ': ' + JSON.stringify(fonts[f][ch]) + (ci < keys.length - 1 ? ',' : ''));
    });
    lines.push('      }' + (fi < all.length - 1 ? ',' : ''));
  });
  var js = [
    '/* HuSS Scorer — js/detect/glyphs.js',
    ' * Stored characters of the printed sheet code for js/detect/ocr.js: the 31 code characters in',
    ' * Courier and Courier New, each its ink box averaged onto a ' + GW + ' x ' + GH + ' grid (darkness 0-255,',
    ' * base64) with its width / height. Generated by tests/tools/glyphs.html; do not edit by hand.',
    ' */',
    '(function (root) {',
    "  'use strict';",
    '  var HUSS = root.HUSS = root.HUSS || {};',
    '  HUSS.detect = HUSS.detect || {};',
    '',
    "  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';",
    '',
    '  function decode(s) {',
    "    var clean = s.replace(/=+$/, ''), out = new Uint8Array(Math.floor(clean.length * 3 / 4)), acc = 0, bits = 0, k = 0;",
    '    for (var i = 0; i < clean.length; i++) {',
    '      acc = (acc << 6) | B64.indexOf(clean[i]);',
    '      bits += 6;',
    '      if (bits >= 8) { bits -= 8; out[k++] = (acc >> bits) & 255; }',
    '    }',
    '    return out;',
    '  }',
    '',
    '  var api = {',
    '    GW: ' + GW + ', GH: ' + GH + ', decode: decode,',
    '    fonts: {'
  ].concat(lines, [
    '    }',
    '  };',
    '  HUSS.detect.glyphs = api;',
    "  if (typeof module === 'object' && module.exports) module.exports = api;",
    '})(typeof globalThis !== \'undefined\' ? globalThis : this);',
    ''
  ]).join('\n');

  document.getElementById('out').value = js;
  window.glyphsJs = js;
  status.textContent = problems.length ? problems.join('; ') : 'Both fonts found. Save the text below as js/detect/glyphs.js.';
  if (problems.length) status.className = 'warn';
})();
</script>
</body>
</html>
