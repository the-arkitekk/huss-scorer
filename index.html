<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HuSS Scorer</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button type="button" class="brand-home" id="brand" data-s-title="home_brand_title"><span data-s="app_title"></span></button>
      <span class="project-chip" id="project-chip" hidden></span>
      <span class="badge" data-s="phase_badge"></span>
      <span class="version" id="version"></span>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" class="tab" data-screen="sheets" data-s="tab_sheets"></button>
      <button type="button" class="tab active" data-screen="score" data-s="tab_score"></button>
      <button type="button" class="tab" data-screen="tables" data-s="tab_tables"></button>
      <button type="button" class="tab" data-screen="results" data-s="tab_results"></button>
      <button type="button" class="tab" data-screen="compare" data-s="tab_compare"></button>
      <button type="button" class="tab" data-screen="guide" data-s="tab_guide"></button>
    </nav>
    <div class="topbar-actions">
      <button type="button" class="btn" id="btn-open" data-s="open_scans"></button>
      <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
      <input type="file" id="files-input" accept="image/jpeg,image/png" multiple hidden>
      <input type="file" id="csv-input" accept=".csv,text/csv" hidden>
      <input type="file" id="subsample-input" accept=".txt,.csv,text/plain,text/csv" hidden>
      <input type="file" id="key-input" accept=".csv,.txt,text/csv,text/plain" hidden>
      <input type="file" id="structures-input" accept=".csv,.txt,text/csv,text/plain" hidden>
    </div>
  </header>

  <main class="layout" id="screen-score">
    <section class="stage" id="stage" tabindex="-1">
      <canvas id="view"></canvas>
      <canvas id="magnifier" class="magnifier" hidden></canvas>

      <div class="dropzone" id="dropzone">
        <div class="dropzone-inner">
          <p class="dropzone-title" data-s="drop_title"></p>
          <p class="dropzone-sub" data-s="drop_sub"></p>
          <div class="btn-row center">
            <button type="button" class="btn btn-primary" id="btn-choose" data-s="drop_button"></button>
            <button type="button" class="btn" id="btn-choose-files" data-s="drop_button_files"></button>
          </div>
          <p class="dropzone-error" id="drop-error" hidden></p>
        </div>
      </div>
      <div class="busy" id="busy" hidden><span id="busy-text" data-s="busy"></span></div>
      <div class="dialog-wrap" id="dup-dialog" hidden>
        <div class="dialog">
          <h2 data-s="dup_title"></h2>
          <p class="small muted" data-s="dup_text"></p>
          <div id="dup-list"></div>
          <button type="button" class="btn btn-primary" id="dup-continue" data-s="dup_continue"></button>
        </div>
      </div>

      <div class="stage-tools" id="stage-tools" hidden>
        <button type="button" class="btn btn-small" id="btn-zoom-out" data-s-title="zoom_out">−</button>
        <button type="button" class="btn btn-small" id="btn-fit" data-s="fit"></button>
        <button type="button" class="btn btn-small" id="btn-zoom-in" data-s-title="zoom_in">+</button>
      </div>
      <div class="hint" id="hint" hidden></div>
    </section>

    <aside class="panel" id="panel">
      <section class="card" id="card-project">
        <h2 data-s="sec_project"></h2>
        <p class="small" id="project-info" data-s="project_none"></p>
        <p class="small bad" id="project-warn" hidden></p>
        <div class="btn-row">
          <button type="button" class="btn btn-xs" id="btn-main-menu" data-s="main_menu"></button>
        </div>
      </section>

      <section class="card" id="card-session">
        <h2 data-s="sec_session"></h2>
        <label class="field"><span data-s="project_code"></span><input type="text" id="in-project" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span data-s="rater_code"></span><input type="text" id="in-rater" autocomplete="off" spellcheck="false" required data-s-placeholder="rater_code_placeholder"></label>
        <p class="small muted rater-help" data-s="rater_code_help"></p>
        <div class="field"><span data-s="mode"></span>
          <div class="radio-row" id="mode-row">
            <label class="check"><input type="radio" name="mode" value="blind" id="mode-blind"><span data-s="mode_blind"></span></label>
            <label class="check"><input type="radio" name="mode" value="open" id="mode-open"><span data-s="mode_open"></span></label>
          </div>
        </div>
        <p class="small muted field-help" data-s="mode_help"></p>
        <div id="session-setup">
          <div class="btn-row">
            <button type="button" class="btn btn-primary btn-xs" id="btn-folder" data-s="choose_folder"></button>
            <button type="button" class="btn btn-xs" id="btn-files" data-s="choose_files"></button>
            <button type="button" class="btn btn-xs" id="btn-resume-csv" data-s="load_csv"></button>
            <button type="button" class="btn btn-xs" id="btn-subsample" data-s="load_subsample"></button>
          </div>
          <p class="small" id="resume-status" hidden></p>
          <label class="check" id="autosave-row" hidden><input type="checkbox" id="chk-autosave" checked><span id="autosave-text"></span></label>
          <div id="open-tables" hidden>
            <div class="btn-row">
              <button type="button" class="btn btn-xs" id="btn-key" data-s="load_key"></button>
              <button type="button" class="btn btn-xs" id="btn-structures" data-s="load_structures"></button>
            </div>
            <p class="small" id="tables-status"></p>
          </div>
          <p class="small bad" id="setup-error" hidden></p>
        </div>
        <div id="session-running" hidden>
          <p class="small" id="session-summary"></p>
          <p class="small muted" id="session-notes" hidden></p>
          <div class="btn-row">
            <button type="button" class="btn btn-primary btn-xs" id="btn-download-csv" data-s="download_csv"></button>
            <button type="button" class="btn btn-xs" id="btn-download-excel" data-s="download_excel"></button>
            <button type="button" class="btn btn-xs" id="btn-new-session" data-s="new_session"></button>
          </div>
          <p class="reminder" id="reminder" hidden></p>
          <p class="small ok" id="download-status" hidden></p>
        </div>
      </section>

      <section class="card" id="card-manual" hidden>
        <h2 data-s="sec_manual"></h2>
        <p class="small" id="manual-why"></p>
        <div class="radio-row manual-methods">
          <label class="check"><input type="radio" name="manual-method" id="mm-corners" value="corners" checked><span data-s="manual_method_corners"></span></label>
          <label class="check"><input type="radio" name="manual-method" id="mm-floorline" value="floorline"><span data-s="manual_method_floorline"></span></label>
        </div>
        <p class="small" id="manual-instr"></p>
        <p class="small muted" id="manual-count"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-xs" id="btn-manual-undo" data-s="manual_undo"></button>
          <button type="button" class="btn btn-xs" id="btn-manual-clear" data-s="manual_clear"></button>
        </div>
        <p class="small bad" id="manual-error" hidden></p>
      </section>

      <section class="card" id="card-handles" hidden>
        <h2 data-s="sec_handles"></h2>
        <table class="handles" id="handle-table"></table>
      </section>

      <section class="card" id="card-values" hidden>
        <h2 data-s="sec_values"></h2>
        <table class="values" id="value-table"></table>
      </section>

      <section class="card" id="card-flags" hidden>
        <h2 data-s="sec_flags"></h2>
        <ul class="flags" id="flag-list"></ul>
        <label class="check"><input type="checkbox" id="chk-color"><span data-s="flag_color_noncompliant"></span></label>
      </section>

      <section class="card" id="card-exclusion" hidden>
        <h2 data-s="sec_exclusion"></h2>
        <div id="excl-list"></div>
        <label class="check"><input type="checkbox" id="chk-nm-v"><span data-s="nm_vertical"></span></label>
        <label class="check"><input type="checkbox" id="chk-nm-h"><span data-s="nm_horizontal"></span></label>
        <label class="field field-top"><span data-s="note"></span><textarea id="in-note" rows="2" class="keep-case"></textarea></label>
      </section>

      <section class="card" id="card-view" hidden>
        <h2 data-s="sec_view"></h2>
        <label class="check"><input type="checkbox" id="chk-contrast"><span data-s="view_contrast"></span></label>
        <label class="check"><input type="checkbox" id="chk-mask"><span data-s="view_mask"></span></label>
        <label class="check"><input type="checkbox" id="chk-guides" checked><span data-s="view_guides"></span></label>
        <label class="check"><input type="checkbox" id="chk-snap" checked><span data-s="view_snap"></span></label>
      </section>

      <section class="card" id="card-sheet" hidden>
        <h2 id="sheet-title"></h2>
        <p class="small later-note" id="later-note" hidden></p>
        <div id="sheet-body">
        <label class="field"><span data-s="sheet_code"></span><input type="text" id="in-sheet" autocomplete="off" spellcheck="false" maxlength="5" data-s-placeholder="sheet_code_placeholder"></label>
        <p class="small" id="sheet-status" data-s="sheet_code_hint"></p>
        <p class="small" id="open-info" hidden></p>
        <p class="small" id="box-info" hidden></p>
        <label class="field field-inline" id="open-structure-row" hidden><span data-s="open_structure_pick"></span><select id="open-structure"></select></label>
        <p class="small" id="image-info"></p>
        <p class="small muted" id="image-align"></p>
        <p class="small bad" id="image-warn" hidden></p>
        </div>
      </section>

      <section class="card card-actions" id="card-actions" hidden>
        <div class="code-check" id="code-check" hidden>
          <p class="small muted" data-s="code_check_help"></p>
          <div class="code-pic"><canvas id="code-pic" data-s-title="code_picture"></canvas></div>
          <label class="check"><input type="checkbox" id="chk-code"><span data-s="code_check"></span></label>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="btn-confirm" data-s="confirm_next"></button>
        <p class="small" id="confirm-status"></p>
        <div class="btn-row nav-row">
          <button type="button" class="btn" id="btn-prev" data-s="previous"></button>
          <button type="button" class="btn" id="btn-later" data-s="review_later"></button>
        </div>
      </section>
    </aside>
  </main>

  <main class="screen-page" id="screen-sheets" hidden>
    <div class="page-grid">
      <section class="page-card">
        <h1 data-s="sg_title"></h1>
        <p class="small muted" data-s="sg_intro"></p>
        <label class="field"><span data-s="sg_template"></span>
          <select id="sg-template"><option value="A4L">A4L · A4 landscape</option><option value="A3L">A3L · A3 landscape</option></select></label>
        <p class="small muted" id="sg-template-note" data-s="sg_template_locked" hidden></p>
        <label class="field"><span data-s="sg_label"></span><input type="text" id="sg-label" maxlength="20" class="keep-case"></label>
        <label class="field"><span data-s="sg_count"></span><input type="number" id="sg-count" min="1" max="500" value="20"></label>
        <label class="field field-top"><span data-s="sg_exclude"></span><textarea id="sg-exclude" rows="3" data-s-placeholder="sg_exclude_placeholder"></textarea></label>
        <div class="btn-row">
          <button type="button" class="btn btn-xs" id="sg-load-list" data-s="sg_load_list"></button>
          <span class="small muted" id="sg-exclude-info"></span>
          <input type="file" id="sg-list-input" accept=".csv,.txt,text/csv,text/plain" hidden>
        </div>
        <button type="button" class="btn btn-primary" id="sg-generate" data-s="sg_generate"></button>
        <p class="small" id="sg-status"></p>
        <div id="sg-result" hidden>
          <p class="warn-box" data-s="sg_print_warning"></p>
          <p class="small" id="sg-check"></p>
          <p class="small" id="sg-boxes-note" hidden></p>
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="sg-print" data-s="sg_print"></button>
            <button type="button" class="btn" id="sg-pdf" data-s="sg_pdf"></button>
            <button type="button" class="btn" id="sg-csv" data-s="sg_csv"></button>
          </div>
          <p class="small muted codes" id="sg-codes"></p>
        </div>
      </section>
      <section class="page-preview" id="sg-preview"></section>
    </div>
  </main>

  <main class="screen-page" id="screen-home" hidden>
    <div class="home">
      <h1 class="home-title" data-s="app_title"></h1>
      <p class="home-tagline" data-s="home_tagline"></p>
      <div class="home-current" id="home-current" hidden>
        <span id="home-current-text"></span>
        <button type="button" class="btn btn-primary btn-xs" id="home-back" data-s="home_back"></button>
        <button type="button" class="btn btn-xs" id="home-edit" data-s="home_edit"></button>
      </div>
      <div class="home-actions">
        <button type="button" class="home-card" id="home-new"><b data-s="home_new"></b><span data-s="home_new_sub"></span></button>
        <button type="button" class="home-card" id="home-open"><b data-s="home_open"></b><span data-s="home_open_sub"></span></button>
        <button type="button" class="home-card" id="home-continue" hidden><b id="home-continue-title"></b><span id="home-continue-sub"></span></button>
      </div>
      <p class="small bad" id="home-error" hidden></p>
      <input type="file" id="home-project-input" accept=".json,application/json" hidden>
      <p class="home-links">
        <button type="button" class="link" id="home-noproject" data-s="home_noproject"></button>
        <button type="button" class="link" id="home-calibration" data-s="home_calibration"></button>
        <button type="button" class="link" id="home-guide" data-s="tab_guide"></button>
      </p>
      <p class="small muted home-version" id="home-version"></p>
    </div>
  </main>

  <main class="screen-page" id="screen-project" hidden>
    <div class="page-grid page-grid-narrow">
      <section class="page-card">
        <h1 id="pf-heading" data-s="pf_title"></h1>
        <p class="small muted" data-s="pf_intro"></p>
        <label class="field"><span data-s="pf_code"></span><input type="text" id="pf-code" maxlength="32"></label>
        <p class="small muted field-help" data-s="pf_code_help"></p>
        <label class="field"><span data-s="pf_title_field"></span><input type="text" id="pf-title" maxlength="200" class="keep-case"></label>
        <label class="field"><span data-s="pf_template"></span>
          <select id="pf-template"><option value="A4L">A4L · A4 landscape</option><option value="A3L">A3L · A3 landscape</option></select></label>
        <label class="field"><span data-s="pf_label"></span><input type="text" id="pf-label" maxlength="20" class="keep-case"></label>
        <label class="field"><span data-s="pf_ref"></span><input type="number" id="pf-ref" step="0.01" min="0.5" max="3"></label>
        <label class="field"><span data-s="pf_min_fig"></span><input type="number" id="pf-min" step="0.5" min="0" max="100"></label>
        <label class="field"><span data-s="pf_foot_tol"></span><input type="number" id="pf-foot" step="0.1" min="0" max="5"></label>
        <label class="field"><span data-s="pf_snap"></span><input type="number" id="pf-snap" step="0.1" min="0.1" max="5"></label>
        <h2 data-s="pf_suggestions"></h2>
        <label class="check"><input type="checkbox" id="pf-sug-figure" checked><span data-s="pf_sug_figure"></span></label>
        <label class="check"><input type="checkbox" id="pf-sug-ceiling" checked><span data-s="pf_sug_ceiling"></span></label>
        <label class="check"><input type="checkbox" id="pf-sug-wall" checked><span data-s="pf_sug_wall"></span></label>
        <h2 data-s="pf_structures"></h2>
        <p class="small muted" data-s="pf_structures_help"></p>
        <table class="grid pf-structures" id="pf-structures">
          <thead><tr><th data-s="tb_col_code"></th><th data-s="tb_col_name"></th><th data-s="tb_col_true_v"></th><th data-s="tb_col_true_h"></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <button type="button" class="btn btn-xs" id="pf-st-add" data-s="tb_add_structure"></button>
        <h2 data-s="pf_exclusions"></h2>
        <div id="pf-excl-list"></div>
        <button type="button" class="btn btn-xs" id="pf-excl-add" data-s="pf_excl_add"></button>
        <p class="small muted" id="pf-rules"></p>
        <p class="small bad" id="pf-errors" hidden></p>
        <p class="small ok" id="pf-saved" hidden></p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="pf-save" data-s="pf_create"></button>
          <button type="button" class="btn" id="pf-cancel" data-s="pf_cancel"></button>
        </div>
        <p class="small muted" data-s="pf_send_note"></p>
      </section>
    </div>
  </main>

  <main class="screen-page" id="screen-tables" hidden>
    <div class="page-grid page-grid-narrow page-grid-key">
      <section class="page-card">
        <h1 data-s="tb_key_title"></h1>
        <p class="small muted" data-s="tb_key_intro"></p>
        <p class="small" id="tb-structures-info"></p>
        <p class="small ok" id="tb-single" hidden></p>
        <table class="grid" id="tb-key">
          <thead><tr><th data-s="tb_col_sheet"></th><th data-s="tb_col_participant"></th><th data-s="tb_col_structure"></th><th></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <datalist id="tb-structure-codes"></datalist>
        <div class="btn-row">
          <button type="button" class="btn btn-xs" id="tb-key-add" data-s="tb_add_row"></button>
          <button type="button" class="btn btn-xs" id="tb-key-import" data-s="tb_import"></button>
          <button type="button" class="btn btn-xs" id="tb-key-download" data-s="tb_download"></button>
          <input type="file" id="tb-key-input" accept=".csv,.txt,text/csv,text/plain" hidden>
        </div>
        <p class="small" id="tb-key-status"></p>
      </section>
        <p class="small muted" data-s="tb_kept"></p>
      </section>
    </div>
  </main>

  <main class="screen-page" id="screen-results" hidden>
    <div class="res-wrap">
      <p class="res-warning" data-s="res_warning"></p>
      <div class="res-controls">
        <section class="page-card">
          <h1 data-s="res_files"></h1>
          <p class="small muted" data-s="res_files_help"></p>
          <ul class="res-files" id="res-files"></ul>
          <div class="btn-row">
            <button type="button" class="btn btn-primary btn-xs" id="res-add" data-s="res_add"></button>
            <button type="button" class="btn btn-xs" id="res-clear" data-s="res_clear"></button>
            <input type="file" id="res-input" accept=".csv,text/csv" multiple hidden>
          </div>
          <p class="small bad" id="res-file-errors" hidden></p>
        </section>
        <section class="page-card">
          <h1 data-s="res_tables"></h1>
          <p class="small muted" data-s="res_tables_help"></p>
          <p class="small" id="res-tables-status"></p>
          <p class="warn-box small" id="res-key-needed" hidden><span id="res-key-needed-text"></span> <button type="button" class="btn btn-xs" id="res-go-tables" data-s="res_add_to_tables"></button></p>
          <div class="btn-row">
            <button type="button" class="btn btn-xs" id="res-use-screen" data-s="res_forget_files" hidden></button>
            <button type="button" class="btn btn-xs" id="res-load-key" data-s="res_load_key"></button>
            <button type="button" class="btn btn-xs" id="res-load-structures" data-s="res_load_structures"></button>
            <input type="file" id="res-key-input" accept=".csv,.txt,text/csv,text/plain" hidden>
            <input type="file" id="res-structures-input" accept=".csv,.txt,text/csv,text/plain" hidden>
          </div>
          <p class="small bad" id="res-table-errors" hidden></p>
        </section>
        <section class="page-card res-merge">
          <p class="small" id="res-merged"></p>
          <div class="btn-row">
            <button type="button" class="btn btn-xs" id="res-dl-merged" data-s="res_dl_merged" disabled></button>
            <button type="button" class="btn btn-xs" id="res-dl-excel" data-s="res_dl_excel" disabled></button>
          </div>
        </section>
      </div>
      <section class="page-card res-report-card">
        <div class="res-report-bar">
          <h1 data-s="res_report"></h1>
          <label class="res-select"><span data-s="res_rater"></span><select id="res-rater"></select></label>
          <label class="res-select"><span data-s="res_method"></span><select id="res-method">
            <option value="main" data-s="rp_method_main"></option>
            <option value="points" data-s="rp_method_points"></option>
            <option value="red" data-s="rp_method_red"></option>
          </select></label>
          <label class="res-select"><span data-s="res_show"></span><select id="res-show">
            <option value="error" data-s="rp_show_error" selected></option>
            <option value="ratio" data-s="rp_show_ratio"></option>
          </select></label>
          <span class="res-spacer"></span>
          <button type="button" class="btn btn-xs" id="res-print" data-s="res_print" disabled></button>
          <button type="button" class="btn btn-xs" id="res-dl-html" data-s="res_dl_html" disabled></button>
        </div>
        <div id="res-report" class="res-report"><p class="small muted" data-s="res_empty"></p></div>
      </section>
    </div>
  </main>

  <main class="screen-page" id="screen-compare" hidden>
    <div class="res-wrap">
      <p class="res-warning" data-s="res_warning"></p>
      <div class="res-controls">
        <section class="page-card">
          <h1 data-s="cmp_title"></h1>
          <p class="small muted" data-s="cmp_intro"></p>
          <ul class="res-files" id="cmp-files"></ul>
          <div class="btn-row">
            <button type="button" class="btn btn-primary btn-xs" id="cmp-add" data-s="res_add"></button>
            <button type="button" class="btn btn-xs" id="cmp-clear" data-s="res_clear"></button>
            <input type="file" id="cmp-input" accept=".csv,text/csv" multiple hidden>
          </div>
          <p class="small bad" id="cmp-file-errors" hidden></p>
          <div class="btn-row">
            <label class="res-select"><span data-s="cmp_r1"></span><select id="cmp-r1"></select></label>
            <label class="res-select"><span data-s="cmp_r2"></span><select id="cmp-r2"></select></label>
          </div>
          <p class="small muted" data-s="cmp_tables_note"></p>
        </section>
        <section class="page-card">
          <h1 data-s="ss_title"></h1>
          <p class="small muted" data-s="ss_intro"></p>
          <div class="btn-row">
